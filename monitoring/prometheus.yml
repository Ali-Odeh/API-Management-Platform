# Prometheus for the local stack (V2.3): the gateway's /metrics (METRICS_ADDR,
# :9091) and the usage-ingest worker's (INGEST_METRICS_PORT, 9092), every 5 s.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9091"]
  - job_name: usage-ingest
    static_configs:
      - targets: ["usage-ingest:9092"]
