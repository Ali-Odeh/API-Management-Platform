services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host 5434 -> container 5432. 5432 and 5433 on the host are taken by local
      # Windows Postgres 18 and 14. Containers still use postgres:5432.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-backend:
    build: ./backend/mock-backend
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build: ./backend/control-plane
    env_file: .env          # DATABASE_URL, JWT_SECRET, INTERNAL_TOKEN, ADMIN_*
    environment:
      # Docker Desktop on Windows doesn't pass file-change events into
      # containers, so the --reload watcher polls for changes instead.
      WATCHFILES_FORCE_POLLING: "true"
    # Apply migrations, then run in dev mode (restart when you save a .py file).
    # --timeout-graceful-shutdown: long-poll requests can stay open up to 60 s;
    # on restart, close them after 3 s instead of waiting (the gateway just asks again).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 3"
    volumes:
      - ./backend/control-plane:/code   # your code, live inside the container
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: ./backend/gateway
    # Only the variables the gateway uses, not the whole .env: it never needs
    # the database password or the JWT secret (least privilege). Values come
    # from .env; ":?" makes `docker compose` refuse to start if one is missing.
    # No depends_on: the gateway must cope with the control plane being down
    # (it keeps retrying and serves its last config).
    environment:
      LISTEN_ADDR: ":8080"   # fixed: the port mapping below depends on it
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:?set CONTROL_PLANE_URL in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      CONFIG_WAIT: ${CONFIG_WAIT:-30s}
    ports:
      # host 8081 -> container 8080. 127.0.0.1:8080 on the host is taken by
      # another Windows app. Containers still use gateway:8080.
      - "8081:8080"
    healthcheck:
      # The image has no curl or wget, so the binary checks itself.
      test: ["CMD", "/gateway", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # dashboard (5173) is added in v2.

volumes:
  pgdata:
