# The API gets its own database login. The owner and retention URLs go only
# to the services that need them.
x-control-plane-environment: &control-plane-environment
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
  GOTRUE_URL: ${GOTRUE_URL:-http://auth:9999}
  GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?set GOTRUE_JWT_SECRET in .env}
  GOTRUE_SERVICE_ROLE_KEY: ${GOTRUE_SERVICE_ROLE_KEY:?set GOTRUE_SERVICE_ROLE_KEY in .env}
  # The developers' GoTrue (P.1): only to verify its tokens on the portal API.
  # The control plane never calls it, so it gets no URL and no admin key.
  PORTAL_GOTRUE_JWT_SECRET: ${PORTAL_GOTRUE_JWT_SECRET:?set PORTAL_GOTRUE_JWT_SECRET in .env}
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?set PLATFORM_ADMIN_EMAIL in .env}
  PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
  # Workspace defaults and the restore period (MT.5); see .env.example.
  WORKSPACE_RATE_LIMIT_PER_MIN: ${WORKSPACE_RATE_LIMIT_PER_MIN:-6000}
  WORKSPACE_MAX_CONCURRENT: ${WORKSPACE_MAX_CONCURRENT:-200}
  WORKSPACE_MAX_SERVICES: ${WORKSPACE_MAX_SERVICES:-100}
  WORKSPACE_MAX_ROUTES: ${WORKSPACE_MAX_ROUTES:-500}
  WORKSPACE_MAX_CONSUMERS: ${WORKSPACE_MAX_CONSUMERS:-5000}
  PURGE_AFTER_DAYS: ${PURGE_AFTER_DAYS:-30}
  # Request bodies (MT.11): a route's limit unless it sets its own, and the
  # most it may set. The gateway gets each route's limit in its config.
  MAX_REQUEST_BODY: ${MAX_REQUEST_BODY:-10MiB}
  MAX_REQUEST_BODY_CEILING: ${MAX_REQUEST_BODY_CEILING:-100MiB}
  # Protection of every workspace (V2.2): requests per minute from one client
  # IP on a public route, and failed key attempts from one IP (in 5 minutes)
  # before it is refused for a while. The gateway gets them in its config.
  PUBLIC_RATE_LIMIT_PER_IP_PER_MIN: ${PUBLIC_RATE_LIMIT_PER_IP_PER_MIN:-600}
  AUTH_FAIL_LIMIT_PER_IP: ${AUTH_FAIL_LIMIT_PER_IP:-20}
  # Internal upstreams the Platform Admin allows (MT.9); the gateway gets the
  # same value. The control plane refuses other internal IP literals and
  # names (localhost, *.internal) with 422 when a service is saved.
  UPSTREAM_ALLOW: ${UPSTREAM_ALLOW-mock-backend,mock-backend-2}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host 5434 -> container 5432. 5432 and 5433 on the host are taken by local
      # Windows Postgres 18 and 14. Containers still use postgres:5432.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job (MT.1): creates GoTrue's login, its `auth` database and the
  # `auth` schema on the shared Postgres. Safe to repeat, so it runs on every
  # `up`, for fresh and existing volumes alike, and exits.
  auth-db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      GOTRUE_DB_PASSWORD: ${GOTRUE_DB_PASSWORD:?set GOTRUE_DB_PASSWORD in .env}
      PORTAL_GOTRUE_DB_PASSWORD: ${PORTAL_GOTRUE_DB_PASSWORD:?set PORTAL_GOTRUE_DB_PASSWORD in .env}
    command: >-
      sh -c 'psql --quiet -v ON_ERROR_STOP=1
      -v auth_password="$$GOTRUE_DB_PASSWORD" -v portal_password="$$PORTAL_GOTRUE_DB_PASSWORD"
      -v apim_db="$$PGDATABASE" -f /init-db.sql'
    volumes:
      - ./backend/auth/init-db.sql:/init-db.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # GoTrue (Supabase Auth), MT.1: login, refresh-token rotation, MFA (TOTP),
  # invitations and recovery. The control plane only verifies its tokens.
  # Pinned version: an update is a deliberate change. Only the variables it
  # uses, never the whole .env (it doesn't need the platform's database).
  auth:
    image: supabase/gotrue:v2.197.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_SITE_URL: http://localhost:5173   # the dashboard (FE milestone)
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://gotrue:${GOTRUE_DB_PASSWORD}@postgres:5432/auth?sslmode=disable
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?set GOTRUE_JWT_SECRET in .env}
      GOTRUE_JWT_EXP: "600"                   # access tokens live 10 minutes
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # Nobody signs up: people join by being added to a workspace (MT.4).
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      # Brute force: /token (password sign-ins and refreshes) allows 30 calls
      # per 5 minutes per IP address (GoTrue's default is 150), MFA challenges
      # and verifications 10 per minute (default 15).
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "30"
      GOTRUE_MFA_RATE_LIMIT_CHALLENGE_AND_VERIFY: "10"
      # Emails (invitations, recovery) all land in Mailpit locally and in CI.
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@apim.localhost
      GOTRUE_SMTP_SENDER_NAME: API Platform
    ports:
      - "9999:9999"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      auth-db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # The developers' GoTrue (P.1), the same pinned image with other settings:
  # anyone may sign up (with a confirmed email), and its tokens carry their
  # own audience and secret, so they open the portal API and nothing else.
  # Its own login and database (auth_portal). No MFA: developers hold no
  # power over a workspace beyond their own apps.
  auth-portal:
    image: supabase/gotrue:v2.197.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9998"
      API_EXTERNAL_URL: http://localhost:9998
      GOTRUE_SITE_URL: http://localhost:5173/portal   # the portal pages (FE milestone)
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://gotrue_portal:${PORTAL_GOTRUE_DB_PASSWORD}@postgres:5432/auth_portal?sslmode=disable
      GOTRUE_JWT_SECRET: ${PORTAL_GOTRUE_JWT_SECRET:?set PORTAL_GOTRUE_JWT_SECRET in .env}
      GOTRUE_JWT_EXP: "600"
      GOTRUE_JWT_AUD: developer               # the control plane's PORTAL_JWT_AUDIENCE
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # Open sign-up, confirmed by email: a token only after the link is opened.
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "false"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "false"
      # Brute force and sign-up abuse: /token 30 calls per 5 minutes per IP,
      # as for members; confirmation and recovery emails 30 an hour (GoTrue's
      # default, written down because open sign-up depends on it).
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "30"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "30"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@apim.localhost
      GOTRUE_SMTP_SENDER_NAME: API Platform Developer Portal
    ports:
      - "9998:9998"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9998/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      auth-db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Catches every email GoTrue sends (MT.1); web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      # This machine only: the inbox holds invitation and password-reset links.
      - "127.0.0.1:8025:8025"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-backend:
    build: ./backend/mock-backend
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A second copy (MT.10), so load balancing and health checks can be seen:
  # a service with both as targets. Reached only inside the Compose network.
  mock-backend-2:
    build: ./backend/mock-backend
    environment:
      INSTANCE_NAME: mock-backend-2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane-db-init:
    build: ./backend/control-plane
    # This one-shot job also provides the environment for the database tests.
    environment:
      <<: *control-plane-environment
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL in .env}
      AUDIT_RETENTION_DATABASE_URL: ${AUDIT_RETENTION_DATABASE_URL:?set AUDIT_RETENTION_DATABASE_URL in .env}
      PURGE_DATABASE_URL: ${PURGE_DATABASE_URL:?set PURGE_DATABASE_URL in .env}
      INGEST_DATABASE_URL: ${INGEST_DATABASE_URL:?set INGEST_DATABASE_URL in .env}
      # The usage-ingest tests read a real stream, in Redis database 15 (V2.1).
      REDIS_TEST_URL: redis://redis:6379/15
    command: sh -c "python -m scripts.prepare_database && alembic upgrade head"
    volumes:
      - ./backend/control-plane:/code
    depends_on:
      auth-db-init:
        condition: service_completed_successfully

  control-plane:
    build: ./backend/control-plane
    environment:
      <<: *control-plane-environment
      # Docker Desktop on Windows doesn't pass file-change events into
      # containers, so the --reload watcher polls for changes instead.
      WATCHFILES_FORCE_POLLING: "true"
    # Run in dev mode (restart when you save a .py file).
    # --timeout-graceful-shutdown: long-poll requests can stay open up to 60 s;
    # on restart, close them after 3 s instead of waiting (the gateway just asks again).
    # --no-access-log: the app writes its own JSON request line, with
    # request_id and workspace_id (app/core/request_log.py, MT.7).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 3 --no-access-log
    volumes:
      - ./backend/control-plane:/code   # your code, live inside the container
    ports:
      - "8000:8000"
    depends_on:
      control-plane-db-init:
        condition: service_completed_successfully
      # At startup it makes sure the first Platform Admin exists in GoTrue.
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Deletes audit events older than AUDIT_RETENTION_DAYS, now and then once a
  # day (MT.3). Its own login (apim_retention) is the only one that may delete
  # audit events, and it gets nothing else from .env. Same image and code as
  # the control plane; it starts once migrations have run.
  audit-retention:
    build: ./backend/control-plane
    command: python -m scripts.audit_retention
    environment:
      AUDIT_RETENTION_DATABASE_URL: ${AUDIT_RETENTION_DATABASE_URL:?set AUDIT_RETENTION_DATABASE_URL in .env}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    volumes:
      - ./backend/control-plane:/code
    depends_on:
      control-plane:
        condition: service_healthy

  # Purges workspaces deleted more than PURGE_AFTER_DAYS ago (when is fixed at
  # deletion, in purge_after), now and then once a day (MT.5). Its own login
  # (apim_purge) may delete a workspace's data and audit events and mark it
  # purged; it gets nothing else from .env.
  workspace-purge:
    build: ./backend/control-plane
    command: python -m scripts.workspace_purge
    environment:
      PURGE_DATABASE_URL: ${PURGE_DATABASE_URL:?set PURGE_DATABASE_URL in .env}
    volumes:
      - ./backend/control-plane:/code
    depends_on:
      control-plane:
        condition: service_healthy

  # Reads the gateway's usage events from the Redis stream into the request
  # log (V2.1), and drops request log months older than
  # REQUEST_LOG_RETENTION_DAYS. Its own login (apim_ingest) may only insert
  # request log rows and set keys' last_used_at. Several copies can run side
  # by side (one consumer group).
  usage-ingest:
    build: ./backend/control-plane
    command: python -m scripts.usage_ingest
    environment:
      INGEST_DATABASE_URL: ${INGEST_DATABASE_URL:?set INGEST_DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      REQUEST_LOG_RETENTION_DAYS: ${REQUEST_LOG_RETENTION_DAYS:-90}
    volumes:
      - ./backend/control-plane:/code
    depends_on:
      control-plane:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scrapes the gateway's and the usage-ingest worker's metrics (V2.3); its
  # UI on 127.0.0.1:9090. Only in the local stack and CI.
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: ./backend/gateway
    # Only the variables the gateway uses, not the whole .env: it never needs
    # the database password or the GoTrue secrets (least privilege). Values come
    # from .env; ":?" makes `docker compose` refuse to start if one is missing.
    # No depends_on: the gateway must cope with the control plane being down
    # (it keeps retrying and serves its last config) and with Redis being
    # down (the rate limit lets requests through until it is back).
    environment:
      LISTEN_ADDR: ":8080"   # fixed: the port mapping below depends on it
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:?set CONTROL_PLANE_URL in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      CONFIG_WAIT: ${CONFIG_WAIT:-30s}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      # Workspaces are its subdomains: acme.localhost reaches workspace `acme`
      # (MT.7); any other name (localhost, gateway) serves `default`.
      GATEWAY_BASE_DOMAIN: ${GATEWAY_BASE_DOMAIN:-localhost}
      # Internal hosts tenants' services may reach anyway (MT.9, SSRF
      # protection); every other internal address gets 502
      # upstream_not_allowed. The local stack allows the mock backend; set it
      # empty in .env to allow nothing, as in production.
      UPSTREAM_ALLOW: ${UPSTREAM_ALLOW-mock-backend,mock-backend-2}
    ports:
      # host 8081 -> container 8080. 127.0.0.1:8080 on the host is taken by
      # another Windows app. Containers still use gateway:8080.
      - "8081:8080"
    healthcheck:
      # The image has no curl or wget, so the binary checks itself.
      test: ["CMD", "/gateway", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # End-to-end tests (step 4.3). In the "test" profile, so `docker compose up`
  # never starts it. Run with:  docker compose run --rm e2e
  # It waits for the stack to be healthy (starting it if needed), then plays
  # the MVP story against the real services and cleans up its own data.
  e2e:
    build: ./e2e
    profiles: ["test"]
    # The Platform Admin's login, and GoTrue's admin key to set up (and clean
    # up) its own test user and MFA factor. Nothing else from .env.
    # ":-" (not ":?"): Compose reads the whole file for every command, so a
    # required value here would stop `docker compose up` too, e.g. when the
    # Platform Admin is invited by email and PLATFORM_ADMIN_PASSWORD is empty.
    # The runner checks them itself when it starts (e2e/conftest.py).
    environment:
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      GOTRUE_SERVICE_ROLE_KEY: ${GOTRUE_SERVICE_ROLE_KEY:-}
      # To remove the developer accounts the portal stories sign up (P.1).
      PORTAL_GOTRUE_SERVICE_ROLE_KEY: ${PORTAL_GOTRUE_SERVICE_ROLE_KEY:-}
    volumes:
      - ./e2e:/e2e
    depends_on:
      auth:
        condition: service_healthy
      auth-portal:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      gateway:
        condition: service_healthy
      mock-backend:
        condition: service_healthy
      mock-backend-2:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The v2 story reads the request log and Prometheus (V2.3).
      usage-ingest:
        condition: service_started
      prometheus:
        condition: service_healthy

  # Browser end-to-end stories (FE): Chromium uses the React app like a
  # person, with the helpers of the API stories. "test" profile; run with:
  #   docker compose run --rm e2e-browser
  e2e-browser:
    build:
      context: ./e2e
      dockerfile: browser/Dockerfile
    profiles: ["test"]
    environment:
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      GOTRUE_SERVICE_ROLE_KEY: ${GOTRUE_SERVICE_ROLE_KEY:-}
      PORTAL_GOTRUE_SERVICE_ROLE_KEY: ${PORTAL_GOTRUE_SERVICE_ROLE_KEY:-}
    # Chromium needs more shared memory than Docker's default 64 MB.
    ipc: host
    volumes:
      - ./e2e:/e2e
    depends_on:
      frontend:
        condition: service_healthy
      auth:
        condition: service_healthy
      auth-portal:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      gateway:
        condition: service_healthy
      mock-backend:
        condition: service_healthy

  # Load test with k6 (step 4.4), also in the "test" profile. Run with:
  #   docker compose run --rm loadtest
  # or with another rate / duration per run:
  #   docker compose run --rm -e RATE=500 -e DURATION=60 loadtest
  # See loadtest/README.md.
  loadtest:
    image: grafana/k6:1.0.0
    profiles: ["test"]
    working_dir: /loadtest
    command: ["run", "gateway.js"]
    environment:
      # Checked by the script's setup (see the e2e service for why not ":?").
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      # To enroll and remove its own MFA factor: raising the `default`
      # workspace's rate limit for the test needs MFA (MT.8).
      GOTRUE_SERVICE_ROLE_KEY: ${GOTRUE_SERVICE_ROLE_KEY:-}
      RATE: ${RATE:-300}
      DURATION: ${DURATION:-30}
    volumes:
      - ./loadtest:/loadtest
    depends_on:
      auth:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      gateway:
        condition: service_healthy
      mock-backend:
        condition: service_healthy
      # The test's service has a target on each instance (MT.12).
      mock-backend-2:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The React app (FE): dashboard, platform pages and developer portal, on
  # http://localhost:5173. Vite's dev server forwards /api to the control
  # plane and /auth/v1, /portal-auth/v1 to the two GoTrue servers, so the
  # browser talks to one origin (no CORS). Edits reload in the browser.
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://control-plane:8000
      AUTH_PROXY_TARGET: http://auth:9999
      PORTAL_AUTH_PROXY_TARGET: http://auth-portal:9998
      # Docker Desktop on Windows passes no file events into containers.
      VITE_POLL: "true"
    volumes:
      - ./frontend:/app
      # Hides the host's node_modules; the image's are in /node_modules.
      - /app/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5173/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      control-plane:
        condition: service_healthy
      auth:
        condition: service_healthy
      auth-portal:
        condition: service_healthy

volumes:
  pgdata:
