# Continuous integration: on every push to main and every pull request, GitHub
# runs the same checks as backend/control-plane/scripts/check.ps1 on a fresh
# machine with a fresh Postgres. A red X here means "don't merge yet".

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/control-plane

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: apim
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app -d apim"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Throwaway values for this run only. Real secrets never belong in a repo.
    env:
      # The owner (migrations, test setup) and the two least-privilege logins,
      # which the tests create with these passwords (MT.3).
      MIGRATION_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/apim
      DATABASE_URL: postgresql+asyncpg://apim_app:ci-only-app-password@localhost:5432/apim
      AUDIT_RETENTION_DATABASE_URL: postgresql+asyncpg://apim_retention:ci-only-retention-password@localhost:5432/apim
      INTERNAL_TOKEN: ci-only-internal-token
      # Unit tests sign their own GoTrue-shaped tokens with this secret and use
      # a fake GoTrue, so no GoTrue process runs here (the e2e job has one).
      GOTRUE_JWT_SECRET: ci-only-gotrue-jwt-secret-at-least-32-chars
      GOTRUE_SERVICE_ROLE_KEY: ci-only-service-role-key
      PLATFORM_ADMIN_EMAIL: admin@example.com
      PLATFORM_ADMIN_PASSWORD: ci-only-platform-admin-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/control-plane/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatting (ruff)
        run: ruff format --check .

      - name: Types (mypy strict)
        run: mypy app

      - name: Tests and coverage (pytest)
        run: pytest -p no:cacheprovider --cov --cov-report=term-missing --cov-fail-under=90

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/gateway

    # A real Redis for the rate-limit tests (the atomic Lua script is what
    # they check). Database 15, like locally.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_TEST_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/gateway/go.mod
          cache-dependency-path: backend/gateway/go.sum

      - name: Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted (run scripts/check.ps1 -Fix):"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet (go vet)
        run: go vet ./...

      # -race finds goroutines touching the same data at once. It needs cgo,
      # which Linux runners have and a default Windows install does not.
      - name: Tests with the race detector (go test)
        run: go test -count=1 -race -cover -coverprofile=cover.out ./...

      - name: Coverage at least 90% (same bar as the control plane)
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | grep -oE '[0-9.]+%' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 90) }' || { echo "Coverage ${total}% is below 90%"; exit 1; }

      # A short run of every fuzz test: random inputs against the path and
      # request-ID checks. Go fuzzes one test of one package per command.
      - name: Fuzz tests (10 s each)
        run: |
          for f in FuzzPrefixFits FuzzIsCleanPath FuzzMatch FuzzStripPrefix; do
            go test -run='^$' -fuzz="^${f}\$" -fuzztime=10s ./internal/proxy
          done
          go test -run='^$' -fuzz='^FuzzValidRequestID$' -fuzztime=10s ./internal/middleware

      - name: Docker image builds
        run: docker build --tag gateway:ci .

  # The whole platform in Docker Compose, then the end-to-end stories
  # (e2e/): GoTrue login (with MFA) -> admin API -> config -> gateway -> auth
  # -> rate limit -> backend.
  # Runs after the unit checks, so a broken unit doesn't waste a stack start.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [control-plane, gateway, mock-backend]

    steps:
      - uses: actions/checkout@v4

      # Fresh random secrets for this run only, made by the same script a
      # developer uses (so the script is tested too). Real secrets never
      # belong in a repo.
      - name: Write a throwaway .env
        run: sh scripts/init-env.sh

      - name: Lint the end-to-end tests and the load-test helper (ruff)
        run: |
          docker compose --profile test build e2e
          docker compose run --rm --no-deps e2e sh -c "ruff check . && ruff format --check ."
          docker compose run --rm --no-deps -v ./loadtest:/loadtest e2e sh -c \
            "ruff check --config pyproject.toml /loadtest && ruff format --config pyproject.toml --check /loadtest"

      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --build --wait

      - name: End-to-end tests
        run: docker compose run --rm e2e

      # The k6 load test at a gentle rate for a few seconds. Not a measurement
      # (shared CI machines are too noisy for timing), just proof the script,
      # its setup and its teardown still work. Thresholds still apply.
      - name: Load test smoke run (k6, 20 requests/s, 5 s per run)
        run: docker compose run --rm -e RATE=20 -e DURATION=5 loadtest

      - name: Service logs (only when something failed)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  mock-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/mock-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/mock-backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests (pytest)
        run: pytest -p no:cacheprovider
