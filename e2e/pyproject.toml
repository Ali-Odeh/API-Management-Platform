# Lint and format rules for the end-to-end tests: the same as the control
# plane's (backend/control-plane/pyproject.toml), minus its database specifics.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: basic style errors
    "F",        # pyflakes: unused imports/variables, undefined names
    "I",        # isort: import order
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern Python syntax
    "SIM",      # simplify: needlessly complex code
    "N",        # pep8-naming
    "RUF",      # ruff's own rules
]

[tool.ruff.lint.isort]
# conftest is pytest's local helper module, imported by the tests.
known-first-party = ["conftest"]
