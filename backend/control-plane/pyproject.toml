# One config file for every dev tool of the control plane.
# Run all checks at once: ./scripts/check.ps1

[project]
name = "control-plane"
version = "0.1.0"
requires-python = ">=3.12"

# ---- ruff: linter + formatter ----
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]  # autogenerated, reviewed by hand

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: basic style errors
    "F",        # pyflakes: unused imports/variables, undefined names
    "I",        # isort: import order
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern Python syntax
    "SIM",      # simplify: needlessly complex code
    "N",        # pep8-naming
    "ASYNC",    # async pitfalls (e.g. blocking calls in async code)
    "RUF",      # ruff's own rules
]

[tool.ruff.lint.isort]
# Our migrations folder is also called "alembic"; the import means the library.
known-third-party = ["alembic"]

[tool.ruff.lint.pep8-naming]
# SQLAlchemy's declared_attr methods receive the class, like a classmethod.
classmethod-decorators = ["sqlalchemy.orm.declared_attr"]

[tool.ruff.lint.per-file-ignores]
# conftest must set DATABASE_URL before importing the app.
"tests/conftest.py" = ["E402"]
"alembic/env.py" = ["E402"]

# ---- mypy: type checker ----
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Every `async def test_...` runs on an event loop automatically.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ---- coverage ----
[tool.coverage.run]
source = ["app"]
branch = true  # also check that both sides of every `if` are tested
# SQLAlchemy's async mode runs our code inside greenlets; without this,
# coverage misses every line after the first `await db...` in a function.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:"]
